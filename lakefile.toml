name = "hex-gfq"
defaultTargets = ["HexGFq"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGFqField"
git = "https://github.com/leanprover/hex-gfq-field.git"
rev = "cfdce9529549ac6ea8423da0d88647e795aa266b"

[[require]]
name = "HexConway"
git = "https://github.com/leanprover/hex-conway.git"
rev = "cd871aff745dba0175a1937191a847ea0af70c54"

[[require]]
name = "HexGF2"
git = "https://github.com/leanprover/hex-gf2.git"
rev = "0df4d0995b40ead932884380a3047ebbe78476a6"

[[lean_lib]]
name = "HexGFq"

# The sync-managed conformance drivers live at `conformance/HexGFq/*.lean`, so
# their module names fall inside the `HexGFq` library's namespace. Lake resolves
# an import against the last library in the owning package that claims it, so
# declaring the conformance sources here, after `lean_lib HexGFq`, is what makes
# `import HexGFq.CrossCheck` — which `conformance/HexGFq/EmitFixtures.lean` does
# — find them. Declaring them only in the conformance sub-project leaves the
# module claimed by the root package too, and Lake then looks for the missing
# `HexGFq/CrossCheck.lean` beside the library source. Not a default target: it
# is verification-only, and the conformance sub-project builds it.
[[lean_lib]]
name = "HexGFqConformanceSupport"
srcDir = "conformance"
globs = ["HexGFq.Conformance", "HexGFq.CrossCheck"]
