name = "hex-gfq-conformance"
defaultTargets = ["hexgfq_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGFq"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "5b3dc5d7789cb680d64f8f4046254f93b7424e4f"

# The conformance drivers themselves are claimed by `lean_lib
# HexGFqConformanceSupport` in the root lakefile, not here; see the comment
# there. Only the emit executable, which needs `hex-test-kit`, lives in this
# sub-project.
[[lean_exe]]
name = "hexgfq_emit_fixtures"
root = "HexGFq.EmitFixtures"
